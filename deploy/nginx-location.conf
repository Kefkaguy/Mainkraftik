# Add only inside the existing HTTPS server block after preflight and backup.
# Join only the existing nginx service to the intelligence-ingress network.
# Existing location / and all existing upstream services remain unchanged.
location = /intelligence/ { return 308 /intelligence; }
location = /intelligence {
    resolver 127.0.0.11 valid=30s;
    set $intelligence_upstream http://intelligence-web:3000;
    proxy_pass $intelligence_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
}
location ^~ /intelligence/ {
    resolver 127.0.0.11 valid=30s;
    set $intelligence_upstream http://intelligence-web:3000;
    proxy_pass $intelligence_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    client_max_body_size 32k;
}
