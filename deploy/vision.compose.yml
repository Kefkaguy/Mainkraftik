# Explicitly opt-in. No network, provider secrets, or database mount.
services:
  vision:
    image: keftrade-intelligence-vision:reviewed
    build:
      context: ..
      dockerfile: deploy/vision.Dockerfile
    profiles: [vision]
    network_mode: none
    mem_limit: 2g
    cpus: 2
    pids_limit: 96
    read_only: true
    tmpfs: [/tmp:size=128m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - intelligence-artifacts:/artifacts
      - ./reviewed-models:/models:ro
    entrypoint: [python, /opt/vision_infer.py]
    environment:
      VISION_WORK_DIR: /artifacts/vision
