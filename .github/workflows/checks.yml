name: Intelligence checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intelligence
          POSTGRES_USER: intelligence
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5543:5432']
        options: >-
          --health-cmd "pg_isready -U intelligence -d intelligence"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      INTELLIGENCE_DATABASE_URL: postgresql://intelligence:integration-test-only@127.0.0.1:5543/intelligence
      INTELLIGENCE_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r apps/api/requirements.lock.txt
      - run: ruff check apps/api
      - run: pytest -q
        working-directory: apps/api
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
